<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка · Портфолио</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face{ font-family:'Trafaret Kit'; src:url('/trafaretkit.ttf') format('truetype'); font-display:swap; }
  :root{
    --void:#161616; --graphite:#4c4c4c; --ash:#cccccc; --frost:#ffffff;
    --paper:#efeee9; --paper-light:#f8f7f3; --border:#e7e4da;
    --terracotta:#b5654a; --terracotta-bg:#f7ece8; --olive:#7a7c4a; --slate:#5b6b7a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--paper); color:var(--void); font-family:'Space Grotesk', system-ui, sans-serif; font-size:14px; }
  button,input,textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }

  .layout{ display:grid; grid-template-columns:300px 1fr; height:100vh; }

  /* sidebar */
  .side{ border-right:1px solid var(--border); background:var(--paper-light); display:flex; flex-direction:column; min-height:0; }
  .brand{ padding:24px 22px 18px; border-bottom:1px solid var(--border); }
  .brand h1{ font-family:'Trafaret Kit','Space Grotesk',sans-serif; font-weight:400; font-size:28px; margin:0; text-transform:uppercase; letter-spacing:-.01em; }
  .brand a{ font-size:12px; color:var(--graphite); text-decoration:none; border-bottom:1px solid var(--ash); }
  .nav{ overflow-y:auto; padding:10px 12px 24px; flex:1; }
  .nav-group{ margin-top:18px; }
  .nav-head{ display:flex; align-items:center; justify-content:space-between; padding:0 10px 8px; }
  .nav-head span{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--graphite); }
  .nav-item{ display:flex; align-items:center; gap:6px; width:100%; padding:10px; border:1px solid transparent; border-radius:12px; background:none; text-align:left; }
  .nav-item:hover{ background:var(--paper); }
  .nav-item.active{ background:var(--frost); border-color:var(--border); box-shadow:0 8px 20px -14px rgba(22,22,22,.35); }
  .nav-item .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; background:var(--ash); }
  .nav-item .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini{ border:none; background:none; color:var(--graphite); padding:2px 5px; border-radius:6px; font-size:12px; opacity:0; }
  .nav-item:hover .mini, .nav-item.active .mini{ opacity:1; }
  .mini:hover{ background:var(--paper); color:var(--void); }
  .add{ border:1px dashed var(--ash); background:none; border-radius:9999px; padding:3px 10px; font-size:12px; color:var(--graphite); }
  .add:hover{ border-color:var(--void); color:var(--void); }

  /* main */
  .main{ display:flex; flex-direction:column; min-height:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 32px; border-bottom:1px solid var(--border); background:var(--paper); }
  .topbar h2{ margin:0; font-size:20px; font-weight:500; }
  .save-state{ font-size:12px; color:var(--graphite); }
  .save-state.dirty{ color:var(--terracotta); }
  .save-state.error{ color:#c0392b; }
  .btn{ border:none; border-radius:9999px; padding:11px 22px; background:var(--void); color:var(--frost); font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .btn-ghost{ background:none; color:var(--void); border:1px solid var(--ash); }
  .btn-danger{ background:none; color:#c0392b; border:1px solid #e5b9b3; }
  .editor{ overflow-y:auto; padding:28px 32px 80px; }
  .editor-inner{ max-width:860px; }

  .group{ background:var(--paper-light); border:1px solid var(--border); border-radius:22px; padding:24px; margin-bottom:20px; }
  .group h3{ margin:0 0 16px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--graphite); font-weight:500; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.wide{ grid-column:1 / -1; }
  .field label{ font-size:12px; color:var(--graphite); }
  .field .hint{ font-size:11px; color:#8a8a8a; }
  input[type=text], textarea{ width:100%; background:var(--frost); border:1px solid var(--border); border-radius:10px; padding:10px 12px; outline:none; transition:border-color .15s; }
  input[type=text]:focus, textarea:focus{ border-color:var(--void); }
  textarea{ resize:vertical; min-height:72px; line-height:1.45; }
  select{ width:100%; background:var(--frost); border:1px solid var(--border); border-radius:10px; padding:10px 12px; outline:none; font:inherit; }
  .img-thumb.video{ background:var(--void); color:var(--frost); display:flex; align-items:center; justify-content:center; font-size:12px; }
  .color-row{ display:flex; gap:8px; align-items:center; }
  .color-row input[type=color]{ width:42px; height:40px; padding:0; border:1px solid var(--border); border-radius:10px; background:none; }

  .img-field{ display:flex; gap:12px; align-items:flex-start; }
  .img-thumb{ width:96px; height:72px; border-radius:10px; border:1px solid var(--border); background:#2a2a2a center/contain no-repeat; flex-shrink:0; }
  .img-thumb.empty{ background:var(--frost); }
  .img-controls{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .img-controls .row{ display:flex; gap:8px; }
  .upload{ border:1px solid var(--ash); background:var(--frost); border-radius:10px; padding:8px 12px; font-size:12px; white-space:nowrap; }
  .upload:hover{ border-color:var(--void); }

  .list-row{ position:relative; background:var(--frost); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .list-row-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .list-row-head .num{ font-size:12px; color:var(--graphite); }
  .row-actions{ display:flex; gap:2px; }
  .row-actions button{ border:none; background:none; padding:4px 8px; border-radius:6px; color:var(--graphite); }
  .row-actions button:hover{ background:var(--paper); color:var(--void); }

  .footer-actions{ display:flex; justify-content:space-between; gap:12px; margin-top:8px; }
  .empty-state{ color:var(--graphite); padding:60px 0; text-align:center; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--void); color:var(--frost); padding:12px 20px; border-radius:9999px; font-size:13px; opacity:0; transition:all .3s ease; pointer-events:none; z-index:10; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; height:auto; }
    .side{ border-right:none; border-bottom:1px solid var(--border); }
    .grid{ grid-template-columns:1fr; }
    .topbar, .editor{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <h1>Админка</h1>
      <a href="/" target="_blank" rel="noopener">Открыть сайт ↗</a>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="editorTitle">Загрузка…</h2>
        <div class="save-state" id="saveState"></div>
      </div>
      <button class="btn" id="saveBtn" disabled>Сохранить</button>
    </div>
    <div class="editor"><div class="editor-inner" id="editor"></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ---------- схема: какие поля у каких сущностей ----------
  var PAIR = [ { k:'t', l:'Заголовок' }, { k:'d', l:'Описание', type:'textarea' } ];
  var ACCENTS = [ ['terracotta', 'Терракотовый'], ['slate', 'Серо-синий'], ['olive', 'Оливковый'] ];
  var BR_HINT = 'Enter — перенос строки в заголовке';

  var SCHEMA = {
    // --- разделы страницы (по одному объекту) ---
    page: {
      label: 'Настройки страницы', group: 'Страница', single: true,
      blank: function(){ return { title:'', description:'' }; },
      groups: [
        { title:'Вкладка браузера и поиск', fields:[
          { k:'title', l:'Заголовок вкладки (title)', wide:true },
          { k:'description', l:'Описание для поисковиков и превью ссылок', type:'textarea', wide:true, hint:'1–2 предложения, до ~160 символов' }
        ]}
      ]
    },
    hero: {
      label: 'Главный экран', group: 'Страница', single: true,
      blank: function(){ return { name:'', year:'', bottomLeft:'', bottomRight:'', marqueeTop:'', marqueeBottom:'', video:'', chat:[] }; },
      groups: [
        { title:'Тексты по углам', fields:[
          { k:'name', l:'Сверху слева' }, { k:'year', l:'Сверху справа' },
          { k:'bottomLeft', l:'Снизу слева' }, { k:'bottomRight', l:'Снизу справа' }
        ]},
        { title:'Бегущая строка', fields:[
          { k:'marqueeTop', l:'Верхняя строка' }, { k:'marqueeBottom', l:'Нижняя строка' }
        ]},
        { title:'Видео', fields:[ { k:'video', l:'Видео в центре', type:'image', wide:true, hint:'mp4, вертикальное (пропорции 1:2)' } ] },
        { title:'Реплики в чате поверх видео', list:'chat', item:'Реплика', fields:[
          { k:'text', l:'Текст', wide:true }, { k:'t', l:'Секунда видео, когда появляется', hint:'Например, 4 или 5.5' }
        ], blank:{ t:'', text:'' } }
      ]
    },
    about: {
      label: 'Как я работаю', group: 'Страница', single: true,
      blank: function(){ return { title:'', text:'', steps:[] }; },
      groups: [
        { title:'Заголовок блока', fields:[ { k:'title', l:'Заголовок', wide:true }, { k:'text', l:'Подзаголовок', type:'textarea', wide:true } ] },
        { title:'Карточки-шаги', list:'steps', item:'Шаг', fields:[
          { k:'title', l:'Заголовок' }, { k:'accent', l:'Цвет', type:'select', options:ACCENTS },
          { k:'text', l:'Текст', type:'textarea', wide:true }
        ], blank:{ title:'', text:'', accent:'terracotta' } }
      ]
    },
    sections: {
      label: 'Заголовки разделов', group: 'Страница', single: true,
      blank: function(){ return {}; },
      groups: [
        { title:'Избранные проекты', fields:[ { k:'projectsTitle', l:'Заголовок', type:'textarea', hint:BR_HINT }, { k:'projectsText', l:'Подзаголовок', type:'textarea' } ] },
        { title:'Сайты', fields:[ { k:'sitesTitle', l:'Заголовок', type:'textarea', hint:BR_HINT }, { k:'sitesText', l:'Подзаголовок', type:'textarea' } ] },
        { title:'Карьера', fields:[ { k:'careerTitle', l:'Заголовок', type:'textarea', hint:BR_HINT } ] }
      ]
    },
    footer: {
      label: 'Футер и контакты', group: 'Страница', single: true,
      blank: function(){ return {}; },
      groups: [
        { title:'Слоган', fields:[ { k:'sloganBright', l:'Тёмная строка' }, { k:'sloganMuted', l:'Серая строка' } ] },
        { title:'Карточка «Связаться»', fields:[
          { k:'cardTitle', l:'Заголовок', wide:true },
          { k:'cardComment', l:'Комментарий', type:'textarea', wide:true },
          { k:'statusLabel', l:'Статус', hint:'Например, «Открыт к работе» или «Сейчас занят»', wide:true }
        ]},
        { title:'Контакты', fields:[
          { k:'telegram', l:'Telegram', hint:'https://t.me/…' }, { k:'email', l:'Email', hint:'Пусто — иконка скрывается' },
          { k:'copyrightName', l:'Имя в копирайте' }
        ]}
      ]
    },

    // --- коллекции ---
    projects: {
      label: 'Проекты (карусель)', group: 'Проекты (карусель)',
      color: function(it){ return it.tile; },
      blank: function(){ return { key:'', title:'Новый проект', short:'', chip:'Проект', tile:'#161616', logo:'', year:'', type:'', duration:'', role:'', desc:'', url:'', urlLabel:'', context:'', problem:'', solution:'', roles:[], process:[], screens:[], result:'' }; },
      groups: [
        { title:'Карточка в карусели', fields:[
          { k:'title', l:'Название' },
          { k:'key', l:'Ключ', hint:'Латиницей, без пробелов, уникальный' },
          { k:'short', l:'Подпись на карточке', type:'textarea', wide:true },
          { k:'chip', l:'Метка' },
          { k:'tile', l:'Цвет фона', type:'color' },
          { k:'logo', l:'Логотип', type:'image', wide:true }
        ]},
        { title:'Шапка кейса', fields:[
          { k:'year', l:'Год' }, { k:'type', l:'Тип продукта' },
          { k:'duration', l:'Длительность', hint:'Пусто — колонка скрывается' }, { k:'role', l:'Роль' },
          { k:'desc', l:'Описание', type:'textarea', wide:true },
          { k:'url', l:'Ссылка', hint:'https://…' }, { k:'urlLabel', l:'Текст ссылки' }
        ]},
        { title:'Скриншоты', list:'screens', item:'Скриншот', fields:[ { k:'src', l:'Картинка', type:'image', wide:true }, { k:'caption', l:'Подпись', wide:true } ], blank:{ src:'', caption:'' } },
        { title:'Контекст и бэкграунд', fields:[
          { k:'context', l:'Контекст', type:'textarea', wide:true },
          { k:'problem', l:'Проблема', type:'textarea' }, { k:'solution', l:'Решение', type:'textarea' }
        ]},
        { title:'Моя роль на проекте', list:'roles', item:'Роль', fields:PAIR, blank:{ t:'', d:'' } },
        { title:'Рабочий процесс', list:'process', item:'Шаг', fields:PAIR, blank:{ t:'', d:'' } },
        { title:'Результат', fields:[ { k:'result', l:'Результат', type:'textarea', wide:true } ] }
      ]
    },
    sites: {
      label: 'Сайты (сетка)', group: 'Сайты (сетка)',
      blank: function(){ return { key:'', title:'Новый сайт', img:'', sitePreview:'', sitePreviewUrl:'', url:'', year:'', type:'Сайт', role:'', desc:'', result:'' }; },
      groups: [
        { title:'Карточка в сетке', fields:[
          { k:'title', l:'Название' },
          { k:'key', l:'Ключ', hint:'Латиницей, без пробелов, уникальный' },
          { k:'url', l:'Адрес сайта', hint:'https://…', wide:true },
          { k:'img', l:'Обложка', type:'image', wide:true }
        ]},
        { title:'Кейс', fields:[
          { k:'year', l:'Год' }, { k:'type', l:'Тип продукта' }, { k:'role', l:'Роль' },
          { k:'sitePreviewUrl', l:'Адрес в превью', hint:'Например, sikhona.tech' },
          { k:'sitePreview', l:'Длинный скриншот сайта', type:'image', wide:true },
          { k:'desc', l:'Описание', type:'textarea', wide:true },
          { k:'result', l:'Результат', type:'textarea', wide:true }
        ]}
      ]
    },
    companies: {
      label: 'Карьера', group: 'Карьера', titleKey: 'name',
      blank: function(){ return { key:'', name:'Новое место работы', dates:'', role:'', duration:'', text:'', projectsTitle:'Самые крупные проекты', projects:[], bullets:[] }; },
      groups: [
        { title:'Компания и роль', fields:[
          { k:'name', l:'Компания' }, { k:'dates', l:'Период', hint:'Например, «Июнь 2022 – Февраль 2026»' },
          { k:'role', l:'Должность' }, { k:'duration', l:'Стаж', hint:'Например, «3 года и 9 месяцев»' },
          { k:'text', l:'Описание обязанностей', type:'textarea', wide:true }
        ]},
        { title:'Заголовок списка проектов', fields:[ { k:'projectsTitle', l:'Заголовок', wide:true } ] },
        { title:'Проекты', list:'projects', item:'Проект', fields:[
          { k:'title', l:'Название', wide:true },
          { k:'text', l:'Описание', type:'textarea', wide:true },
          { k:'result', l:'Результат', wide:true },
          { k:'linkText', l:'Слово-ссылка в результате', hint:'Например, «Microsoft Store»' }, { k:'linkUrl', l:'Ссылка', hint:'https://…' }
        ], blank:{ title:'', text:'', result:'', linkText:'', linkUrl:'' } },
        { title:'Список достижений (буллеты)', list:'bullets', item:'Пункт', fields:[ { k:'text', l:'Текст', wide:true } ], blank:{ text:'' } }
      ]
    }
  };

  var data = null;
  var sel = { section:'hero', index:0 };
  var dirty = false;

  var $nav = document.getElementById('nav');
  var $editor = document.getElementById('editor');
  var $title = document.getElementById('editorTitle');
  var $saveBtn = document.getElementById('saveBtn');
  var $state = document.getElementById('saveState');
  var $toast = document.getElementById('toast');

  function h(tag, attrs, children){
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k){
      if (k === 'class') el.className = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'text') el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    [].concat(children || []).forEach(function(c){ if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  function toast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function(){ $toast.classList.remove('show'); }, 2400);
  }

  function setDirty(v){
    dirty = v;
    $saveBtn.disabled = !v;
    $state.className = 'save-state' + (v ? ' dirty' : '');
    $state.textContent = v ? 'Есть несохранённые изменения' : ($state.dataset.saved || '');
  }

  function move(arr, i, d){
    var j = i + d;
    if (j < 0 || j >= arr.length) return false;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    return true;
  }

  function current(){
    var s = SCHEMA[sel.section];
    return s.single ? data[sel.section] : data[sel.section][sel.index];
  }

  // ---------- сайдбар ----------
  function itemTitle(s, it){ return it[s.titleKey || 'title'] || '(без названия)'; }

  function renderNav(){
    $nav.innerHTML = '';
    var groups = {};
    Object.keys(SCHEMA).forEach(function(section){
      var s = SCHEMA[section];
      if (!groups[s.group]){
        groups[s.group] = h('div', { class:'nav-group' }, [ h('div', { class:'nav-head' }, [ h('span', { text:s.group }) ]) ]);
        $nav.appendChild(groups[s.group]);
      }
      var group = groups[s.group];

      if (s.single){
        var activeS = sel.section === section;
        group.appendChild(h('button', { class:'nav-item' + (activeS ? ' active' : ''), onclick:function(){ sel = { section:section, index:0 }; renderAll(); } }, [
          h('span', { class:'dot' }), h('span', { class:'name', text:s.label })
        ]));
        return;
      }

      group.firstChild.appendChild(h('button', { class:'add', text:'+ Добавить', onclick:function(){
        data[section].push(s.blank());
        sel = { section:section, index:data[section].length - 1 };
        setDirty(true); renderAll();
      }}));
      data[section].forEach(function(it, i){
        var active = sel.section === section && sel.index === i;
        group.appendChild(h('button', { class:'nav-item' + (active ? ' active' : ''), onclick:function(){ sel = { section:section, index:i }; renderAll(); } }, [
          h('span', { class:'dot', style:'background:' + ((s.color && s.color(it)) || 'var(--ash)') }),
          h('span', { class:'name', text:itemTitle(s, it) }),
          h('span', { class:'mini', title:'Выше', text:'↑', onclick:function(e){ e.stopPropagation(); if (move(data[section], i, -1)){ if (active) sel.index--; setDirty(true); renderAll(); } } }),
          h('span', { class:'mini', title:'Ниже', text:'↓', onclick:function(e){ e.stopPropagation(); if (move(data[section], i, 1)){ if (active) sel.index++; setDirty(true); renderAll(); } } })
        ]));
      });
    });
  }

  // ---------- поля ----------
  function fieldEl(obj, f, onChange){
    var id = 'f' + Math.random().toString(36).slice(2);
    var val = obj[f.k] == null ? '' : obj[f.k];
    var wrap = h('div', { class:'field' + (f.wide ? ' wide' : '') }, [ h('label', { for:id, text:f.l }) ]);

    function update(v){ obj[f.k] = v; setDirty(true); if (onChange) onChange(); }

    if (f.type === 'textarea'){
      wrap.appendChild(h('textarea', { id:id, oninput:function(e){ update(e.target.value); } }, [String(val)]));
    } else if (f.type === 'select'){
      var sel_ = h('select', { id:id, onchange:function(e){ update(e.target.value); } });
      f.options.forEach(function(o){ var op = h('option', { value:o[0], text:o[1] }); if (o[0] === val) op.selected = true; sel_.appendChild(op); });
      wrap.appendChild(sel_);
    } else if (f.type === 'color'){
      var text = h('input', { type:'text', id:id, value:val });
      var picker = h('input', { type:'color', value: /^#[0-9a-f]{6}$/i.test(val) ? val : '#161616' });
      text.addEventListener('input', function(){ update(text.value); if (/^#[0-9a-f]{6}$/i.test(text.value)) picker.value = text.value; });
      picker.addEventListener('input', function(){ text.value = picker.value; update(picker.value); });
      wrap.appendChild(h('div', { class:'color-row' }, [picker, text]));
    } else if (f.type === 'image'){
      var thumb = h('div', { class:'img-thumb' });
      var input = h('input', { type:'text', id:id, value:val, placeholder:'covers/…' });
      var file = h('input', { type:'file', accept:'image/*,video/mp4,video/webm', style:'display:none' });
      function refresh(){
        var v = input.value.trim();
        var isVideo = /\.(mp4|webm)$/i.test(v);
        thumb.className = 'img-thumb' + (v ? '' : ' empty') + (isVideo ? ' video' : '');
        thumb.textContent = isVideo ? '▶ видео' : '';
        thumb.style.backgroundImage = v && !isVideo ? 'url("/' + v.replace(/^\//, '').replace(/"/g, '') + '")' : '';
      }
      input.addEventListener('input', function(){ update(input.value.trim()); refresh(); });
      file.addEventListener('change', function(){
        var fl = file.files[0];
        if (!fl) return;
        toast('Загружаю ' + fl.name + '…');
        fetch('/admin/api/upload?name=' + encodeURIComponent(fl.name), { method:'POST', body:fl })
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.ok) throw new Error(res.error || 'ошибка');
            input.value = res.path; update(res.path); refresh();
            toast('Загружено: ' + res.path);
          })
          .catch(function(err){ toast('Не удалось загрузить: ' + err.message); })
          .then(function(){ file.value = ''; });
      });
      refresh();
      wrap.appendChild(h('div', { class:'img-field' }, [
        thumb,
        h('div', { class:'img-controls' }, [
          h('div', { class:'row' }, [ input, h('button', { class:'upload', type:'button', text:'Загрузить…', onclick:function(){ file.click(); } }) ]),
          file
        ])
      ]));
    } else {
      wrap.appendChild(h('input', { type:'text', id:id, value:val, oninput:function(e){ update(e.target.value); } }));
    }
    if (f.hint) wrap.appendChild(h('span', { class:'hint', text:f.hint }));
    return wrap;
  }

  function listGroup(obj, g){
    if (!Array.isArray(obj[g.list])) obj[g.list] = [];
    var arr = obj[g.list];
    var box = h('div', { class:'group' }, [ h('h3', { text:g.title }) ]);
    arr.forEach(function(row, i){
      var grid = h('div', { class:'grid' });
      g.fields.forEach(function(f){ grid.appendChild(fieldEl(row, f)); });
      box.appendChild(h('div', { class:'list-row' }, [
        h('div', { class:'list-row-head' }, [
          h('span', { class:'num', text:g.item + ' ' + (i + 1) }),
          h('div', { class:'row-actions' }, [
            h('button', { type:'button', title:'Выше', text:'↑', onclick:function(){ if (move(arr, i, -1)){ setDirty(true); renderEditor(); } } }),
            h('button', { type:'button', title:'Ниже', text:'↓', onclick:function(){ if (move(arr, i, 1)){ setDirty(true); renderEditor(); } } }),
            h('button', { type:'button', title:'Удалить', text:'✕', onclick:function(){ arr.splice(i, 1); setDirty(true); renderEditor(); } })
          ])
        ]),
        grid
      ]));
    });
    box.appendChild(h('button', { class:'add', type:'button', text:'+ ' + g.item, onclick:function(){ arr.push(JSON.parse(JSON.stringify(g.blank))); setDirty(true); renderEditor(); } }));
    return box;
  }

  // ---------- редактор ----------
  function renderEditor(){
    var s = SCHEMA[sel.section];
    var obj = current();
    $editor.innerHTML = '';
    if (!obj){
      $title.textContent = s.label;
      $editor.appendChild(h('div', { class:'empty-state', text:'Здесь пока пусто — нажми «+ Добавить» слева.' }));
      return;
    }
    $title.textContent = s.single ? s.label : itemTitle(s, obj);

    s.groups.forEach(function(g){
      if (g.list){ $editor.appendChild(listGroup(obj, g)); return; }
      var grid = h('div', { class:'grid' });
      g.fields.forEach(function(f){
        var isName = !s.single && (f.k === (s.titleKey || 'title') || f.k === 'tile');
        grid.appendChild(fieldEl(obj, f, isName ? function(){ $title.textContent = itemTitle(s, obj); renderNav(); } : null));
      });
      $editor.appendChild(h('div', { class:'group' }, [ h('h3', { text:g.title }), grid ]));
    });

    if (!s.single){
      $editor.appendChild(h('div', { class:'footer-actions' }, [
        h('button', { class:'btn btn-ghost', type:'button', text:'Дублировать', onclick:function(){
          var copy = JSON.parse(JSON.stringify(obj));
          copy.key = (copy.key || 'item') + '-copy'; var tk = s.titleKey || 'title'; copy[tk] = (copy[tk] || '') + ' (копия)';
          data[sel.section].splice(sel.index + 1, 0, copy);
          sel.index++; setDirty(true); renderAll();
        }}),
        h('button', { class:'btn btn-danger', type:'button', text:'Удалить', onclick:function(){
          if (!confirm('Удалить «' + itemTitle(s, obj) + '»? Изменение вступит в силу после сохранения.')) return;
          data[sel.section].splice(sel.index, 1);
          sel.index = Math.max(0, sel.index - 1); setDirty(true); renderAll();
        }})
      ]));
    }
  }

  function renderAll(){ renderNav(); renderEditor(); }

  // ---------- сохранение ----------
  function validate(){
    var seen = {};
    var all = data.projects.concat(data.sites);
    for (var i = 0; i < all.length; i++){
      var k = (all[i].key || '').trim();
      if (!k) return '«' + (all[i].title || 'без названия') + '»: заполни поле «Ключ»';
      if (!/^[a-z0-9_-]+$/i.test(k)) return '«' + all[i].title + '»: ключ только латиницей, цифрами, - и _';
      if (seen[k]) return 'Ключ «' + k + '» повторяется';
      seen[k] = true;
    }
    return null;
  }

  function save(){
    if (!dirty) return;
    var err = validate();
    if (err){ toast(err); return; }
    $saveBtn.disabled = true;
    fetch('/admin/api/content', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(data) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) throw new Error(res.error || 'ошибка');
        $state.dataset.saved = 'Сохранено в ' + res.savedAt;
        setDirty(false);
        toast('Сохранено. Обнови сайт, чтобы увидеть изменения');
      })
      .catch(function(e){
        $saveBtn.disabled = false;
        $state.className = 'save-state error';
        $state.textContent = 'Не сохранилось: ' + e.message;
      });
  }

  $saveBtn.addEventListener('click', save);
  document.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', function(e){ if (dirty){ e.preventDefault(); e.returnValue = ''; } });

  fetch('/content.json', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d;
      Object.keys(SCHEMA).forEach(function(k){
        var sc = SCHEMA[k];
        if (sc.single){ if (!data[k] || typeof data[k] !== 'object') data[k] = sc.blank(); }
        else if (!Array.isArray(data[k])) data[k] = [];
      });
      renderAll();
    })
    .catch(function(e){ $title.textContent = 'Не удалось загрузить content.json: ' + e.message; });
})();
</script>
</body>
</html>
